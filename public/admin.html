<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YuGiKi! - Panel de Administración</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>

<body>
  <!-- Header navbar -->
  <nav class="navbar sticky-top border-bottom border-2 border-primary bg-white">
    <div class="container-fluid position-relative">
      <span class="navbar-brand">
        <span class="fg-primary fw-bolder text-2xl">YuGiKi!</span>
      </span>

      <!-- Controles derechos -->
      <div class="d-flex align-items-center gap-1">
        <button
          type="button"
          id="btn-logout-admin"
          class="btn-outline theme-danger d-inline-flex align-items-center gap-2"
          aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right lh-1" aria-hidden="true"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="h3 mb-1">Gestión de Usuarios</h1>
        <p class="fg-2 mb-0">Administrá las cuentas registradas en la plataforma.</p>
      </div>
      <span id="contador-usuarios" class="badge theme-primary rounded-1 fs-6 d-none sm:d-inline-block">0 usuarios</span>
    </div>

    <!-- Region de alertas de exito o error -->
    <div id="status-mensaje" role="status" aria-live="polite" class="mb-3"></div>

    <!-- Filtro por username -->
    <div class="row mb-3">
      <div class="col-12 md:col-5 lg:col-4">
        <label class="form-control form-adorn border-subtle-primary bg-white">
          <span class="form-adorn-icon fg-primary" aria-hidden="true">
            <i class="bi bi-search"></i>
          </span>
          <input type="search" id="filtro-username" class="form-ghost" maxlength="30"
            placeholder="Buscar por usuario..." aria-label="Buscar por nombre de usuario" autocomplete="off">
        </label>
      </div>
    </div>

    <div class="card border border-primary shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="theme-primary">
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Usuario</th>
              <th scope="col">Rol</th>
              <th scope="col" class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios">
            <tr>
              <td colspan="4" class="text-center py-4 fg-2">Cargando usuarios...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Controles de paginacion -->
      <div id="contenedor-paginacion"
        class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2 d-none"
        hidden>
        <small id="info-paginacion" class="fg-2"></small>
        <nav aria-label="Paginación de usuarios">
          <ul id="lista-paginacion" class="pagination pagination-sm theme-primary mb-0"></ul>
        </nav>
      </div>
    </div>
  </main>

  <!-- Dialog de confirmacion de eliminacion -->
  <dialog class="dialog" id="modal-confirmar-eliminacion" aria-labelledby="modalEliminarLabel">
    <div class="dialog-header border-bottom border-2 border-primary">
      <h2 class="dialog-title fs-lg fw-bold mb-0" id="modalEliminarLabel">Confirmar eliminación</h2>
      <button type="button" class="btn-solid btn-close-custom theme-primary" data-bs-dismiss="dialog" aria-label="Cerrar">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
    <div class="dialog-body py-4">
      <p class="mb-2">
        ¿Estás seguro de eliminar al usuario <strong id="modal-username"></strong>?
      </p>
      <p class="fg-danger fs-sm mb-0">
        Esta acción es irreversible y también eliminará todos sus mazos asociados.
      </p>
    </div>
    <div class="dialog-footer border-top border-2 border-primary justify-content-end gap-2">
      <button type="button" class="btn-outline theme-primary" data-bs-dismiss="dialog">Cancelar</button>
      <button type="button" class="btn-solid theme-danger" id="btn-confirmar-eliminar">Eliminar usuario</button>
    </div>
  </dialog>

  <script type="module" src="js/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/navbar.js"></script>
  <script type="module" src="js/pages/admin.js"></script>
</body>

</html>
