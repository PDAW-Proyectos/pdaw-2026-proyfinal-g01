<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuGiKi - Cartas</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/cartas.css">
</head>
<body>
    <!-- Header navbar -->
    <nav class="navbar sticky-top border-bottom border-2 border-primary bg-white">
        <div class="container-fluid position-relative">
            <a href="index.html" class="navbar-brand">
                <span class="fg-primary fw-bolder text-2xl">YuGiKi!</span>
            </a>

            <!-- Controles derechos -->
            <div class="d-flex align-items-center gap-1">
                <div class="search-trigger-wrapper">
                    <button
                        type="button"
                        class="btn-icon btn-lg fg-primary search-trigger-btn"
                        data-bs-toggle="dialog"
                        data-bs-target="#searchDialog"
                        aria-label="Buscar cartas">
                        <span class="search-trigger-placeholder">Buscar cartas...</span>
                        <i class="bi bi-search search-trigger-icon lh-1" aria-hidden="true"></i>
                    </button>
                </div>

                <button
                    class="btn-icon btn-lg navbar-toggler fg-primary"
                    type="button"
                    data-bs-toggle="drawer"
                    data-bs-target="#navbarDrawer"
                    aria-controls="navbarDrawer"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                    <i class="bi bi-list navbar-list-icon lh-1" aria-hidden="true"></i>
                </button>
            </div>

        </div>
    </nav>

    <!-- Navbar Drawer -->
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
        <div class="drawer-header">
            <h5 class="drawer-title fs-xl fw-bold" id="navbarDrawerLabel">Menú</h5>
            <button type="button" class="btn-solid btn-close-custom theme-primary" data-bs-dismiss="drawer" aria-label="Cerrar">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
        </div>

        <div class="mx-3 border-bottom border-primary"></div>

        <!-- d-flex flex-column + fs-lg para agrandar fuente y empujar nav-auth al fondo -->
        <div class="drawer-body d-flex flex-column fs-lg">
            <ul class="navbar-nav w-100 mb-3">
                <!-- Inicio -->
                <li class="nav-item w-100">
                    <a href="index.html" class="nav-link d-flex justify-content-between align-items-center w-100 active" aria-current="page">
                        <span>Inicio</span>
                        <i class="bi bi-house-door" aria-hidden="true"></i>
                    </a>
                </li>

                <!-- Cartas -->
                <li class="nav-item w-100">
                    <a href="cartas.html" class="nav-link d-flex justify-content-between align-items-center w-100">
                        <span>Cartas</span>
                        <i class="bi bi-suit-spade" aria-hidden="true"></i>
                    </a>
                </li>

                <!-- Mazos (Acordeón nativo de Bootstrap 6) -->
                <li class="nav-item w-100">
                    <details class="nav-mazos-accordion w-100">
                        <summary class="nav-link d-flex justify-content-between align-items-center w-100 list-unstyled" style="cursor: pointer;">
                            <span>Mazos</span>
                            <span class="d-inline-flex align-items-center gap-2">
                                <i class="bi bi-chevron-down fs-sm" aria-hidden="true"></i>
                                <i class="bi bi-collection" aria-hidden="true"></i>
                            </span>
                        </summary>
                        <ul class="navbar-nav p-3 border-start border-2 border-primary ms-4 my-1 fs-md">
                            <li class="nav-item w-100">
                                <a href="coleccion.html" class="nav-link d-flex justify-content-between align-items-center w-100">
                                    <span>Mis creaciones</span>
                                    <i class="bi bi-person-lines-fill" aria-hidden="true"></i>
                                </a>
                            </li>
                            <li class="nav-item w-100">
                                <a href="mazos-comunidad.html" class="nav-link d-flex justify-content-between align-items-center w-100">
                                    <span>De la comunidad</span>
                                    <i class="bi bi-people" aria-hidden="true"></i>
                                </a>
                            </li>
                        </ul>
                    </details>
                </li>
            </ul>
        </div>

        <div class="mx-3 border-bottom border-primary"></div>

        <!-- mt-auto empuja nav-auth al fondo del drawer -->
        <div id="nav-auth" class="drawer-footer justify-content-center border-0"></div>
    </dialog>

    <!-- Dialog de Búsqueda (estilo documentación oficial de Bootstrap) -->
    <dialog class="dialog dialog-lg dialog-slide-down mt-12 mb-auto" id="searchDialog" aria-labelledby="searchDialogLabel">
        <div class="dialog-header border-0">
            <div class="form-control form-adorn border-0 shadow-none py-2 px-4 me-4" role="search">
                <div class="form-adorn-icon fg-primary me-2" aria-hidden="true">
                    <i class="bi bi-search fs-lg"></i>
                </div>
                <input
                    type="search"
                    class="form-ghost fs-lg"
                    id="navbarSearchInput"
                    placeholder="Buscar cartas..."
                    aria-label="Buscar cartas"
                    autofocus>
            </div>
            <button type="button" class="btn-solid btn-close-custom theme-primary ms-2" data-bs-dismiss="dialog" aria-label="Cerrar búsqueda">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div class="border-bottom border-primary border-2 mx-2"></div>
        <div class="dialog-body" id="searchResults">
            <p class="fg-2 text-center my-4">Escribe para comenzar a buscar cartas...</p>
        </div>
    </dialog>

    <!-- Catálogo de cartas -->
    <main class="py-4">
        <div class="container-custom">
    
            <!-- Selects de ordenamiento -->
            <div class="toolbar mb-4 border border-primary">
                <select class="filter-select" id="selectAlfabetico" aria-label="Ordenar alfabéticamente">
                    <option value="none" selected>Ordenar alfabéticamente</option>
                    <option value="nombre-asc">Nombre: A - Z</option>
                    <option value="nombre-desc">Nombre: Z - A</option>
                </select>

                <select class="filter-select" id="selectPrecio" aria-label="Ordenar por precio">
                    <option value="none" selected>Ordenar por precio</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                </select>
            </div>

            <p class="cards-status" id="cards-status" role="status" aria-live="polite"></p>
            <div class="cards-grid" id="cardsGrid" aria-busy="true"></div>
            <nav class="cards-pagination" aria-label="Paginación del catálogo">
                <button class="pagination-button" id="previous-page" type="button" disabled>
                    <
                </button>
                <span class="pagination-status" id="pagination-status" aria-live="polite"></span>
                <button class="pagination-button" id="next-page" type="button" disabled>
                    >
                </button>
            </nav>
        </div>
    </main>

    <template id="card-template">
        <article class="card-flip border border-primary" tabindex="0">
            <div class="card-flip-inner">
                <div class="card-face card-front">
                    <img class="card-image" alt="" loading="lazy">
                    <div class="card-front-info">
                        <div class="card-front-info-row">
                            <div style="min-width:0;">
                                <div class="card-front-name"></div>
                                <div class="card-front-type"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-face card-back">
                    <ul class="back-attr-list"></ul>
                    <a href="carta.html" class="btn-details">Ver detalles</a>
                </div>
            </div>
        </article>
    </template>

    <!-- Footer -->
    <footer class="bg-dark fg-light p-4">
        <div class="d-flex gap-2 justify-content-around text-center">
            <div>
                <h3>Recursos</h3>
                <ul class="list-unstyled">
                    <li><a class="text-decoration-none fg-light" href="https://www.yugioh-card.com/eu/es/events/">Eventos</a></li>
                    <li><a class="text-decoration-none fg-light" href="https://www.yugioh-card.com/eu/play/tcg-beginners-guide/">Guías</a></li>
                </ul>
            </div>
            <div>
                <h3>Soporte</h3>
                <ul class="list-unstyled">
                    <li><a class="text-decoration-none fg-light" href="salud.html">Estado API</a></li>
                </ul>
            </div>
            <div>
                <h3>Síguenos</h3>
                <ul class="list-unstyled">
                    <li><a class="text-decoration-none fg-light" href="https://discord.gg/KcSbkspf8">Discord</a></li>
                </ul>
            </div>
        </div>
        <div class="w-100 text-center border-top">
            <p class="mb-0 fs-sm">© 2026 YuGiKi!. Todos los derechos reservados.</p>
        </div>
    </footer>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script type="module" src="js/pages/cartas.js"></script>
    <script type="module" src="js/components/navbar.js"></script>
</body>
</html>
