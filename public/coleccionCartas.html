<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuGiKi! - Cartas</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header integrado: Navbar (sin búsqueda rápida ni borde inferior) + Buscador, orden y filtros -->
    <header id="catalogHeader" class="sticky-top bg-white border-bottom border-2 border-primary">
        <nav class="navbar bg-white">
            <div class="container-fluid position-relative">
                <a href="index.html" class="navbar-brand">
                    <span class="fg-primary fw-bolder text-2xl">YuGiKi!</span>
                </a>

                <!-- Controles derechos -->
                <div class="d-flex align-items-center gap-1">
                    <button
                        class="btn-icon btn-lg navbar-toggler fg-primary"
                        type="button"
                        data-bs-toggle="drawer"
                        data-bs-target="#navbarDrawer"
                        aria-controls="navbarDrawer"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                        <i class="bi bi-list navbar-list-icon lh-1" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Barra integrada de búsqueda, ordenamiento y filtros -->
        <div class="bg-white px-3 px-md-4 pb-3 pt-1">
            <div class="max-w-768px mx-auto">
                <div class="d-flex justify-content-center align-items-center gap-2">
                    <!-- Búsqueda en el centro -->
                    <div class="flex-grow-1 min-w-0" role="search">
                        <label class="form-control form-adorn border-subtle-primary bg-body catalog-search-box">
                            <div class="form-adorn-icon fg-primary" aria-hidden="true">
                                <i class="bi bi-search"></i>
                            </div>
                            <input
                                type="search"
                                class="form-ghost"
                                id="catalogSearchInput"
                                placeholder="Buscar cartas..."
                                aria-label="Buscar cartas"
                                autocomplete="off">
                        </label>
                    </div>

                    <!-- Botón de orden (solo ícono) al lado de la búsqueda -->
                    <div class="position-relative flex-shrink-0">
                        <button
                            class="btn-outline btn-icon btn-lg theme-primary"
                            type="button"
                            id="catalogSortCombobox"
                            data-bs-toggle="combobox"
                            data-bs-name="orden"
                            data-bs-placeholder="Ordenar por"
                            data-bs-placement="bottom-end"
                            aria-label="Ordenar cartas"
                            title="Ordenar cartas">
                            <i class="bi bi-arrow-down-up" aria-hidden="true"></i>
                            <span class="combobox-value visually-hidden">Ordenar por</span>
                        </button>
                        <div class="menu">
                            <button class="menu-item" type="button" data-bs-value="">Sin orden</button>
                            <div class="menu-header fg-primary fw-semibold border-bottom border-primary mb-1">Alfabético</div>
                            <button class="menu-item" type="button" data-bs-value="nombre-asc">Nombre: A - Z</button>
                            <button class="menu-item" type="button" data-bs-value="nombre-desc">Nombre: Z - A</button>
                            <div class="menu-header fg-primary fw-semibold border-bottom border-primary mb-1">Precio</div>
                            <button class="menu-item" type="button" data-bs-value="precio-asc">Precio: menor a mayor</button>
                            <button class="menu-item" type="button" data-bs-value="precio-desc">Precio: mayor a menor</button>
                        </div>
                    </div>

                    <!-- Botón de filtros (solo ícono) al lado de ordenar -->
                    <button
                        type="button"
                        class="btn-outline btn-icon btn-lg theme-primary flex-shrink-0"
                        id="catalogFiltersToggleBtn"
                        data-bs-toggle="collapse"
                        data-bs-target="#catalogFiltersCollapse"
                        aria-expanded="false"
                        aria-controls="catalogFiltersCollapse"
                        aria-label="Filtros"
                        title="Filtros">
                        <i class="bi bi-funnel" aria-hidden="true"></i>
                    </button>
                </div>

                <!-- Acordeón de filtros -->
                <div class="collapse" id="catalogFiltersCollapse">
                    <form id="catalogFiltersForm" class="p-3 mt-3" novalidate>
                        <div class="grid gap-3">
                            <div class="g-col-6 sm:g-col-3 form-field">
                                <label for="catalogFilterFrameType" class="form-label fs-xs fw-semibold mb-1">Marco</label>
                                <button
                                    class="form-control form-control-sm combobox-toggle bg-body"
                                    type="button"
                                    id="catalogFilterFrameType"
                                    data-bs-toggle="combobox"
                                    data-bs-name="frameType"
                                    data-bs-placeholder="Todos">
                                    <span class="combobox-value">Todos</span>
                                    <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z" fill="currentcolor"/></svg>
                                </button>
                                <div class="menu">
                                    <button class="menu-item" type="button" data-bs-value="">Todos</button>
                                    <button class="menu-item" type="button" data-bs-value="normal">Normal</button>
                                    <button class="menu-item" type="button" data-bs-value="effect">Efecto</button>
                                    <button class="menu-item" type="button" data-bs-value="ritual">Ritual</button>
                                    <button class="menu-item" type="button" data-bs-value="fusion">Fusión</button>
                                    <button class="menu-item" type="button" data-bs-value="synchro">Sincronía</button>
                                    <button class="menu-item" type="button" data-bs-value="xyz">Xyz</button>
                                    <button class="menu-item" type="button" data-bs-value="link">Link</button>
                                    <button class="menu-item" type="button" data-bs-value="normal_pendulum">Péndulo Normal</button>
                                    <button class="menu-item" type="button" data-bs-value="effect_pendulum">Péndulo Efecto</button>
                                    <button class="menu-item" type="button" data-bs-value="ritual_pendulum">Péndulo Ritual</button>
                                    <button class="menu-item" type="button" data-bs-value="fusion_pendulum">Péndulo Fusión</button>
                                    <button class="menu-item" type="button" data-bs-value="synchro_pendulum">Péndulo Sincronía</button>
                                    <button class="menu-item" type="button" data-bs-value="xyz_pendulum">Péndulo Xyz</button>
                                    <button class="menu-item" type="button" data-bs-value="spell">Mágica</button>
                                    <button class="menu-item" type="button" data-bs-value="trap">Trampa</button>
                                    <button class="menu-item" type="button" data-bs-value="token">Ficha (Token)</button>
                                    <button class="menu-item" type="button" data-bs-value="skill">Habilidad (Skill)</button>
                                </div>
                            </div>
                            <div class="g-col-6 sm:g-col-3 form-field">
                                <label for="catalogFilterRace" class="form-label fs-xs fw-semibold mb-1">Raza / Subtipo</label>
                                <button
                                    class="form-control form-control-sm combobox-toggle bg-body"
                                    type="button"
                                    id="catalogFilterRace"
                                    data-bs-toggle="combobox"
                                    data-bs-name="race"
                                    data-bs-placeholder="Todas">
                                    <span class="combobox-value">Todas</span>
                                    <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z" fill="currentcolor"/></svg>
                                </button>
                                <div class="menu">
                                    <button class="menu-item" type="button" data-bs-value="">Todas</button>
                                    <div class="menu-header fg-primary fw-semibold border-bottom border-primary mb-1">Monstruos</div>
                                    <button class="menu-item" type="button" data-bs-value="Aqua">Aqua</button>
                                    <button class="menu-item" type="button" data-bs-value="Beast">Bestia</button>
                                    <button class="menu-item" type="button" data-bs-value="Winged Beast">Bestia Alada</button>
                                    <button class="menu-item" type="button" data-bs-value="Divine-Beast">Bestia Divina</button>
                                    <button class="menu-item" type="button" data-bs-value="Cyberse">Ciberso</button>
                                    <button class="menu-item" type="button" data-bs-value="Fiend">Demonio</button>
                                    <button class="menu-item" type="button" data-bs-value="Dinosaur">Dinosaurio</button>
                                    <button class="menu-item" type="button" data-bs-value="Creator God">Dios Creador</button>
                                    <button class="menu-item" type="button" data-bs-value="Dragon">Dragón</button>
                                    <button class="menu-item" type="button" data-bs-value="Warrior">Guerrero</button>
                                    <button class="menu-item" type="button" data-bs-value="Beast-Warrior">Guerrero-Bestia</button>
                                    <button class="menu-item" type="button" data-bs-value="Fairy">Hada</button>
                                    <button class="menu-item" type="button" data-bs-value="Illusion">Ilusión</button>
                                    <button class="menu-item" type="button" data-bs-value="Insect">Insecto</button>
                                    <button class="menu-item" type="button" data-bs-value="Spellcaster">Lanzador de Conjuros</button>
                                    <button class="menu-item" type="button" data-bs-value="Machine">Máquina</button>
                                    <button class="menu-item" type="button" data-bs-value="Fish">Pez</button>
                                    <button class="menu-item" type="button" data-bs-value="Pyro">Piro</button>
                                    <button class="menu-item" type="button" data-bs-value="Plant">Planta</button>
                                    <button class="menu-item" type="button" data-bs-value="Psychic">Psíquico</button>
                                    <button class="menu-item" type="button" data-bs-value="Reptile">Reptil</button>
                                    <button class="menu-item" type="button" data-bs-value="Rock">Roca</button>
                                    <button class="menu-item" type="button" data-bs-value="Sea Serpent">Serpiente Marina</button>
                                    <button class="menu-item" type="button" data-bs-value="Thunder">Trueno</button>
                                    <button class="menu-item" type="button" data-bs-value="Wyrm">Wyrm</button>
                                    <button class="menu-item" type="button" data-bs-value="Zombie">Zombi</button>
                                    <div class="menu-header fg-primary fw-semibold border-bottom border-primary mb-1">Mágicas / Trampas</div>
                                    <button class="menu-item" type="button" data-bs-value="Normal">Normal</button>
                                    <button class="menu-item" type="button" data-bs-value="Continuous">Continua</button>
                                    <button class="menu-item" type="button" data-bs-value="Quick-Play">Juego Rápido</button>
                                    <button class="menu-item" type="button" data-bs-value="Equip">Equipo</button>
                                    <button class="menu-item" type="button" data-bs-value="Field">Campo</button>
                                    <button class="menu-item" type="button" data-bs-value="Ritual">Ritual</button>
                                    <button class="menu-item" type="button" data-bs-value="Counter">Contraefecto</button>
                                </div>
                            </div>
                            <div class="g-col-6 sm:g-col-3 form-field">
                                <label for="catalogFilterAttribute" class="form-label fs-xs fw-semibold mb-1">Atributo</label>
                                <button
                                    class="form-control form-control-sm combobox-toggle bg-body"
                                    type="button"
                                    id="catalogFilterAttribute"
                                    data-bs-toggle="combobox"
                                    data-bs-name="attribute"
                                    data-bs-placeholder="Todos">
                                    <span class="combobox-value">Todos</span>
                                    <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z" fill="currentcolor"/></svg>
                                </button>
                                <div class="menu">
                                    <button class="menu-item" type="button" data-bs-value="">Todos</button>
                                    <button class="menu-item" type="button" data-bs-value="DARK">Oscuridad (DARK)</button>
                                    <button class="menu-item" type="button" data-bs-value="LIGHT">Luz (LIGHT)</button>
                                    <button class="menu-item" type="button" data-bs-value="EARTH">Tierra (EARTH)</button>
                                    <button class="menu-item" type="button" data-bs-value="WATER">Agua (WATER)</button>
                                    <button class="menu-item" type="button" data-bs-value="FIRE">Fuego (FIRE)</button>
                                    <button class="menu-item" type="button" data-bs-value="WIND">Viento (WIND)</button>
                                    <button class="menu-item" type="button" data-bs-value="DIVINE">Divino (DIVINE)</button>
                                </div>
                            </div>
                            <div class="g-col-6 sm:g-col-3 form-field">
                                <label for="catalogFilterLevel" class="form-label fs-xs fw-semibold mb-1">Nivel / Rango</label>
                                <input type="number" class="form-control form-control-sm bg-body" id="catalogFilterLevel" name="level" data-card-filter="level" min="0" max="13" step="1" placeholder="0 - 13">
                            </div>
                            <div class="g-col-6 sm:g-col-3 form-field">
                                <label for="catalogFilterAtk" class="form-label fs-xs fw-semibold mb-1">ATK</label>
                                <input type="number" class="form-control form-control-sm bg-body" id="catalogFilterAtk" name="atk" data-card-filter="atk" min="-1" step="1" placeholder="Ej: 2500">
                            </div>
                            <div class="g-col-6 sm:g-col-3 form-field">
                                <label for="catalogFilterDef" class="form-label fs-xs fw-semibold mb-1">DEF</label>
                                <input type="number" class="form-control form-control-sm bg-body" id="catalogFilterDef" name="def" data-card-filter="def" min="-1" step="1" placeholder="Ej: 2100">
                            </div>
                            <div class="g-col-6 sm:g-col-3 form-field">
                                <label for="catalogFilterScale" class="form-label fs-xs fw-semibold mb-1">Escala Péndulo</label>
                                <input type="number" class="form-control form-control-sm bg-body" id="catalogFilterScale" name="scale" data-card-filter="scale" min="0" max="13" step="1" placeholder="0 - 13">
                            </div>
                            <div class="g-col-6 sm:g-col-3 form-field">
                                <label for="catalogFilterLinkval" class="form-label fs-xs fw-semibold mb-1">Valor Link</label>
                                <input type="number" class="form-control form-control-sm bg-body" id="catalogFilterLinkval" name="linkval" data-card-filter="linkval" min="1" max="6" step="1" placeholder="1 - 6">
                            </div>
                        </div>
                        <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
                            <button type="submit" class="btn-solid btn-lg theme-primary" id="catalogFiltersApplyBtn">
                                Aplicar filtros
                            </button>
                            <button
                                type="button"
                                class="btn-outline btn-lg theme-primary d-inline-flex align-items-center gap-2"
                                id="catalogFiltersClearBtn"
                                aria-label="Limpiar filtros"
                                title="Limpiar filtros">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                    <path d="M14.2 1.8 8.8 7.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                    <path d="M6.6 5.4 10.6 9.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                    <path d="M6.4 5.9 1.8 9.8l1.2 1.2 1.4-1.4-.8 2 1.2 1.2 2-.8-1.4 1.4 1.2 1.2 3.9-4.6Z" fill="currentColor"/>
                                </svg>
                                <span>Limpiar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- Navbar Drawer -->
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
        <div class="drawer-header">
            <h5 class="drawer-title fs-xl fw-bold" id="navbarDrawerLabel">Menú</h5>
            <button type="button" class="btn-solid btn-close-custom theme-primary" data-bs-dismiss="drawer" aria-label="Cerrar">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
        </div>

        <div class="mx-3 border-bottom border-2 border-primary"></div>

        <!-- d-flex flex-column + fs-lg para agrandar fuente y empujar nav-auth al fondo -->
        <div class="drawer-body d-flex flex-column fs-lg">
            <ul class="navbar-nav w-100 mb-3">
                <!-- Inicio -->
                <li class="nav-item w-100">
                    <a href="index.html" class="nav-link d-flex justify-content-between align-items-center w-100">
                        <span>Inicio</span>
                        <i class="bi bi-house-door" aria-hidden="true"></i>
                    </a>
                </li>

                <!-- Cartas -->
                <li class="nav-item w-100">
                    <a href="coleccionCartas.html" class="nav-link d-flex justify-content-between align-items-center w-100 active" aria-current="page">
                        <span>Cartas</span>
                        <i class="bi bi-suit-spade" aria-hidden="true"></i>
                    </a>
                </li>

                <!-- Mazos (Acordeón nativo de Bootstrap 6) -->
                <li class="nav-item w-100">
                    <details class="nav-mazos-accordion w-100">
                        <summary class="nav-link d-flex justify-content-between align-items-center w-100 list-unstyled" style="cursor: pointer;">
                            <span>Mazos</span>
                            <span class="d-inline-flex align-items-center gap-2">
                                <i class="bi bi-chevron-down fs-sm" aria-hidden="true"></i>
                                <i class="bi bi-collection" aria-hidden="true"></i>
                            </span>
                        </summary>
                        <ul class="navbar-nav p-3 border-start border-2 border-primary ms-4 my-1 fs-md">
                            <li class="nav-item w-100">
                                <a href="coleccionMazos.html" class="nav-link d-flex justify-content-between align-items-center w-100">
                                    <span>Mis creaciones</span>
                                    <i class="bi bi-person-lines-fill" aria-hidden="true"></i>
                                </a>
                            </li>
                            <li class="nav-item w-100">
                                <a href="mazos-comunidad.html" class="nav-link d-flex justify-content-between align-items-center w-100">
                                    <span>De la comunidad</span>
                                    <i class="bi bi-people" aria-hidden="true"></i>
                                </a>
                            </li>
                        </ul>
                    </details>
                </li>
            </ul>
        </div>

        <div class="mx-3 border-bottom border-2 border-primary"></div>

        <!-- mt-auto empuja nav-auth al fondo del drawer -->
        <div id="nav-auth" class="drawer-footer justify-content-center border-0"></div>
    </dialog>

    <!-- Catálogo de cartas -->
    <main class="flex-grow-1 py-6 px-3 md:py-8 md:px-4 bg-body fg-body">
        <div class="container">
            <p class="fg-2 text-center mb-4" id="cards-status" role="status" aria-live="polite" hidden></p>
            <div class="d-flex flex-wrap justify-content-center gap-4" id="cardsGrid" aria-busy="true"></div>
            <nav class="cards-pagination mt-8" aria-label="Paginación del catálogo"></nav>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark fg-light p-4">
        <div class="d-flex gap-2 justify-content-around text-center">
            <div>
                <h3>Recursos</h3>
                <ul class="list-unstyled">
                    <li><a class="text-decoration-none fg-light" href="https://www.yugioh-card.com/eu/es/events/">Eventos</a></li>
                    <li><a class="text-decoration-none fg-light" href="https://www.yugioh-card.com/eu/play/tcg-beginners-guide/">Guías</a></li>
                </ul>
            </div>
            <div>
                <h3>Soporte</h3>
                <ul class="list-unstyled">
                    <li><a class="text-decoration-none fg-light" href="salud.html">Estado API</a></li>
                </ul>
            </div>
            <div>
                <h3>Síguenos</h3>
                <ul class="list-unstyled">
                    <li><a class="text-decoration-none fg-light" href="https://discord.gg/KcSbkspf8">Discord</a></li>

        </div>
        <div class="w-100 text-center border-top">
            <p class="mb-0 fs-sm">© 2026 YuGiKi!. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script type="module" src="js/pages/navbar.js"></script>

</body>
