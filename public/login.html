<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio sesion - YuGiKi</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/custom.css">
</head>

<body class="d-flex flex-column">
    <!-- Login Container -->
    <div class="min-vh-100 d-flex flex-column flex-grow-1 justify-content-center align-items-center p-4">
        <div class="login-separator"><a href="index.html" class="text-decoration-none"><span class="fg-primary fw-bolder text-3xl">YuGiKi!</span></a></div>

        <div class="w-100 flex-grow-1 d-flex justify-content-center align-items-center">
            <div class="max-w-450px border border-primary p-6 shadow bg-white">
                <h1 class="text-center fg-primary">Iniciar sesión</h1>
                <div class="d-flex align-items-center gap-3 my-4">
                    <div class="border-top flex-grow-1"></div>
                </div>
    
                <p class="text-center">Ingresa tus credenciales para acceder</p>
                
    
                <form action="#" method="POST" id="form-login" novalidate>
                    <div class="form-field my-4">
                        <label for="username" class="form-label">Username</label>
                        <input
                            type="text"
                            class="form-control rounded-0"
                            id="username"
                            name="username"
                            placeholder="Ingrese su username"
                            required
                            aria-describedby="error-username">
                    </div>
                    <div class="form-field my-4">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <div class="form-control form-adorn rounded-0">
                            <input
                                type="password"
                                class="form-ghost"
                                id="contraseña"
                                name="contraseña"
                                placeholder="Ingrese su contraseña"
                                required
                                aria-describedby="error-contraseña">
                            <button
                                type="button"
                                id="show-password"
                                class="p-0 border-0 bg-transparent lh-1"
                                aria-label="Mostrar contraseña">
                            <i class="bi bi-eye fs-md" aria-hidden="true"></i>
                        </button>
                        </div>
                    </div>
                    <div id="status-mensaje" role="alert" aria-live="polite" class="text-center mb-3"></div>
                    <button type="submit" class="btn w-100 theme-primary btn-solid rounded-0 my-4">Ingresar</button>
                </form>
    
                <div class="d-flex align-items-center gap-3 my-4">
                    <div class="border-top flex-grow-1"></div>
                    <span class="fg-2 small">o</span>
                    <div class="border-top flex-grow-1"></div>
                </div>
    
                <div class="text-center mt-3">
                    ¿No tienes una cuenta? <a class="fw-bold text-decoration-none" href="registro.html">Regístrate aquí</a>
                </div>
            </div>
        </div>

        <div class="login-separator"></div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark fg-light p-4">
        <div class="container text-center">
            <p class="mb-0 fs-sm">© 2026 YuGiKi!. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script type="module" src="js/components/navbar.js"></script>
    <script type="module" src="js/pages/login.js"></script>
</body>

</html>
