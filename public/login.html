<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio sesion - YuGiKi</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Iniciar sesión</h1>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <div id="status-mensaje" role="alert" aria-live="polite" class="mb-3 text-danger fw-bold"></div>

            <form action="#" method="POST" id="form-login" novalidate>
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="Ingrese su username"
                        required
                        aria-describedby="error-username"
                    >
                
                    <small id="error-username" class="error text-danger d-block"></small>
                </div>

                <div class="form-group">
                    <label for="contraseña" class="form-label">Contraseña</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="contraseña"
                            name="contraseña"
                            class="form-input"
                            placeholder="Ingresa tu contraseña"
                            required
                            aria-describedby="error-contraseña"
                        >
                        <button id="show-password" type="button"><i class="bi bi-eye fs-5"></i></button>
                    </div>
                    <small id="error-contraseña" class="error text-danger d-block"></small>
                </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Ingresar</button>

            </form>

            <div class="login-divider">
                <span>o</span>
            </div>

            <div class="signup-link">
                ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 YuGiKi. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script type="module" src="js/components/navbar.js"></script>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
