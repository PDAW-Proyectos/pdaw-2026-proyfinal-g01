<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - YuGiKi</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>
    <!-- Registro Container -->
    <div class="container flex-grow-1">
        <div class="row justify-content-center align-items-center min-vh-75 py-5">
            <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                <div class="register-card">
                    <div class="register-header">
                        <h1>Crear cuenta</h1>
                        <p>Regístrate para acceder a todas las funciones</p>
                    </div>

                    <!-- Resumen de errores accesible -->
                    <div id="resumen-errores" role="alert" tabindex="-1" hidden class="alert alert-danger mb-3">
                        <h2 class="h6 fw-bold">Hay datos para corregir</h2>
                        <ul id="lista-errores" class="mb-0"></ul>
                    </div>

                    <div id="status-mensaje" role="alert" aria-live="polite" class="mb-3 fw-bold text-center"></div>

                    <form action="#" method="POST" id="form-registro" novalidate>
                        <div class="mb-4">
                            <label for="nombre" class="form-label-custom">Nombre completo</label>
                            <input type="text" id="nombre" name="nombre" 
                                class="form-control form-control-custom" placeholder="Ingrese su nombre"
                                required aria-describedby="ayuda-nombre error-nombre">
                            <small id="ayuda-nombre"></small>
                            <small id="error-nombre" class="error"></small>
                        </div>

                        <div class="mb-4">
                            <label for="username" class="form-label-custom">Nombre de usuario</label>
                            <input type="text" id="username" name="username" class="form-control form-control-custom"
                                placeholder="ejemplo123"  
                                required aria-describedby="ayuda-username error-username">
                            <small id="ayuda-username"></small>
                            <small id="error-username" class="error"></small>
                        </div>

                        <div class="mb-4">
                            <label for="contraseña" class="form-label-custom">Contraseña</label>
                            <input type="password" id="contraseña" name="contraseña"
                                class="form-control form-control-custom" placeholder="Mínimo 6 caracteres" minlength="8"
                                required aria-describedby="ayuda-contraseña error-contraseña">
                            <small id="ayuda-contraseña"></small>
                            <small id="error-contraseña" class="error"></small>
                        </div>

                        <div class="mb-4">
                            <label for="confirm-password" class="form-label-custom">Confirmar contraseña</label>
                            <input type="password" id="confirm-password" name="confirm-password"
                                class="form-control form-control-custom" placeholder="Repite tu contraseña"
                                minlength="6" required aria-describedby="error-confirm-password">
                            <small id="error-confirm-password" class="error"></small>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="terminos" name="terminos" required aria-describedby="error-terminos">
                                <label class="form-check-label" for="terminos" style="color: var(--text-secondary);">
                                    Acepto los <a href="#"
                                        style="color: var(--primary-color); text-decoration: none;">Términos y
                                        Condiciones</a>
                                </label>
                            </div>
                            <small id="error-terminos" class="error"></small>
                        </div>

                        <button type="submit" class="btn btn-custom-primary w-100 mb-3">
                            Crear cuenta
                        </button>
                    </form>

                    <div class="register-divider">
                        <span>o</span>
                    </div>

                    <div class="login-link">
                        ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 YuGiKi. Todos los derechos reservados.</p>
        </div>
    </footer>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/registro.js"></script>
</body>

</html>
